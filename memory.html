<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>Memory Match | MindArena</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="back" href="index.html">← Back to games</a>
    <h1>Memory <span>Match</span></h1>
    <p class="stats">Moves: <span id="moves">0</span></p>
  </header>
  <div class="board" id="board"></div>
  <button class="btn" id="restart">Restart</button>
  <div class="modal" id="modal">
  <div class="modal-box">
    <div class="trophy">🏆</div>
    <h2>You Won!</h2>
    <p>You finished in <strong id="finalMoves">0</strong> moves.</p>
    <button class="btn" id="playAgain">Play Again</button>
    <a class="btn btn-ghost" href="index.html">Main Menu</a>
  </div>
</div>
  <script src="memory.js"></script>
</body>
</html>
