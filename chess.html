  <header>
    <a class="back" href="index.html">← Back to games</a>
    <h1>Ch<span>ess</span></h1>
    <p class="stats" id="status">White's turn</p>
  </header>

  <div class="chessboard" id="chessboard"></div>

  <div class="chess-actions">
    <button class="btn" id="undo">Undo</button>
    <button class="btn" id="restart">Restart</button>
  </div>

  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="trophy">♚</div>
      <h2 id="result">Checkmate</h2>
      <p>Good game!</p>
      <button class="btn" id="playAgain">Play Again</button>
      <a class="btn btn-ghost" href="index.html">Main Menu</a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
