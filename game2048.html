<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 | MindArena</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a class="back" href="index.html">← Back to games</a>
    <h1>2<span>048</span></h1>
    <p class="stats">Score: <span id="score">0</span></p>
  </header>
  <div class="board2048" id="grid"></div>
  <button class="btn" id="restart">Restart</button>

  <div class="modal" id="modal">
    <div class="modal-box">
      <div class="trophy">🎮</div>
      <h2>Game Over</h2>
      <p>Your score: <strong id="finalScore">0</strong></p>
      <button class="btn" id="playAgain">Play Again</button>
      <a class="btn btn-ghost" href="index.html">Main Menu</a>
    </div>
  </div>
  <script src="game2048.js"></script>
</body>
</html>
